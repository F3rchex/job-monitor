AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Job Monitor - Lambda scraping + API infrastructure

Globals:
  Function:
    Timeout: 300
    MemorySize: 512
    Runtime: python3.12
    Environment:
      Variables:
        TZ: Europe/Madrid

Parameters:
  TelegramBotToken:
    Type: String
    NoEcho: true
    Description: Token del bot de Telegram

  TelegramChatId:
    Type: String
    Description: ID del chat de Telegram

  OpenAIApiKey:
    Type: String
    NoEcho: true
    Description: API Key de OpenAI

Resources:
  ScrapingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: job-monitor-scraping
      CodeUri: .
      Handler: lambda/scraping/handler.lambda_handler
      Description: Scraping diario de ofertas Python en Madrid
      Environment:
        Variables:
          TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
          TELEGRAM_CHAT_ID: !Ref TelegramChatId
          OPENAI_API_KEY: !Ref OpenAIApiKey
      Policies:
        - S3FullAccessPolicy:
            BucketName: job-monitor-data
        - CloudWatchLogsFullAccess
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: 'cron(0 9 * * ? *)'
            Description: Scraping diario 11:00 AM Madrid (10:00 UTC)
            Enabled: true

  APIFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: job-monitor-api
      CodeUri: .
      Handler: lambda/api/handler.lambda_handler
      Description: API REST para endpoints Flask (health, trigger-scraping, chat)
      Environment:
        Variables:
          TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
          TELEGRAM_CHAT_ID: !Ref TelegramChatId
          OPENAI_API_KEY: !Ref OpenAIApiKey
      Policies:
        - S3FullAccessPolicy:
            BucketName: job-monitor-data
        - CloudWatchLogsFullAccess
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY

  TelegramFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: job-monitor-telegram
      CodeUri: .
      Handler: lambda/telegram/handler.lambda_handler
      Description: Bot de Telegram con webhook para consultar ofertas
      Environment:
        Variables:
          TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
          TELEGRAM_CHAT_ID: !Ref TelegramChatId
          OPENAI_API_KEY: !Ref OpenAIApiKey
      Policies:
        - S3FullAccessPolicy:
            BucketName: job-monitor-data
        - CloudWatchLogsFullAccess
      Events:
        TelegramWebhook:
          Type: Api
          Properties:
            Path: /telegram-webhook
            Method: POST

Outputs:
  ScrapingFunctionArn:
    Description: ARN de la Lambda de scraping
    Value: !GetAtt ScrapingFunction.Arn

  ScrapingFunctionName:
    Description: Nombre de la Lambda
    Value: !Ref ScrapingFunction

  APIFunctionArn:
    Description: ARN de la Lambda API
    Value: !GetAtt APIFunction.Arn

  APIFunctionName:
    Description: Nombre de la Lambda API
    Value: !Ref APIFunction

  ApiUrl:
    Description: URL base del API Gateway
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/'

  TelegramFunctionArn:
    Description: ARN de la Lambda Telegram
    Value: !GetAtt TelegramFunction.Arn

  TelegramFunctionName:
    Description: Nombre de la Lambda Telegram
    Value: !Ref TelegramFunction

  TelegramWebhookUrl:
    Description: URL del webhook de Telegram (usar con setWebhook)
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/telegram-webhook'
